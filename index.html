const KIND={formTrigger:"Form",chatTrigger:"Chat",webhook:"Webhook",telegramTrigger:"Telegram",whatsAppTrigger:"WhatsApp",gmailTrigger:"Gmail",facebookLeadAdsTrigger:"Facebook Leads",scheduleTrigger:"Schedule",errorTrigger:"On error",manualTrigger:"Manual",n8nTrigger:"On n8n start",executeWorkflowTrigger:"Called by workflow"};
const CAT=t=>/Trigger$|^webhook$/.test(t)?"trigger":/agent|chainLlm|lmChat|embeddings|vectorStore|memory|outputParser|textSplitter|documentDefault|informationExtractor|googleGemini|openAi|toolWorkflow|agentTool/i.test(t)?"ai":/^(if|switch|filter|splitInBatches|merge|wait)$/.test(t)?"logic":/googleSheets|googleDrive|googleCalendar|dataTable|postgres/i.test(t)?"data":/telegram|whatsApp|gmail|form$|respondToWebhook|emailSend|facebook|linkedIn|twilio|httpRequest/i.test(t)?"msg":"code";

  const aiCount=nodes.filter(n=>CAT(n.t)==="ai").length;
  $("#app").innerHTML=`<section class="phero"><div class="wrap"><div>
    <div class="eyebrow" style="color:var(--p)">${esc(p.cat)}</div><h1 style="margin-top:12px">${esc(p.name)}<br><span style="color:var(--muted);font-weight:700">${esc(p.sub)}</span></h1>
    <div class="by"><svg width="18" height="18" viewBox="0 0 30 30" aria-hidden="true"><circle cx="14" cy="16" r="10" fill="none" stroke="var(--ink)" stroke-width="3.4"/><circle cx="23.5" cy="7" r="4.2" fill="var(--sun)"/></svg>by OMNA</div>
    <p class="lede">${esc(p.tag)}</p><div class="chips" style="margin-top:16px">${p.ch.map(c=>`<span class="pill">${esc(c)}</span>`).join("")}</div>
    <div class="stats"><div><b class="tnum">${ordered.length||"—"}</b><span>workflows</span></div><div><b class="tnum">${nodes.length||"—"}</b><span>nodes</span></div><div><b class="tnum">${trig.length||"—"}</b><span>triggers</span></div><div><b class="tnum">${aiCount||"—"}</b><span>AI nodes</span></div></div></div>
    <div class="panel how"><div class="eyebrow" style="margin-bottom:14px">How it works</div><ol class="steps">${p.steps.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></li>`).join("")}</ol></div></div></section>
  <section class="band"><div class="wrap"><div class="sechead"><div><div class="eyebrow">Try it</div><h2 style="margin-top:8px">Every way in</h2><p>Each trigger that starts this project. Forms open live on the OMNA n8n server; chat and messaging channels are reached through their apps.</p></div></div><div class="try" id="try"></div></div></section>
  <section class="band" style="background:var(--surface)"><div class="wrap"><div class="sechead"><div><div class="eyebrow">Watch a run</div><h2 style="margin-top:8px">The workflows</h2><p>Drawn from the live n8n files. Pick a starting trigger and press Play to light up the path a run takes, or click any node to read about it.</p></div></div>
    <div class="tabs" role="tablist" id="wfTabs"></div><div class="panel explorer"><div class="canvas" id="canvas"></div><div class="side"><div class="ctrl"><label class="note" for="startSel">Start from</label><select id="startSel"></select><div style="display:flex;gap:8px"><button class="btn sm" id="play" type="button">Play run</button><button class="btn ghost sm" id="dl" type="button">Download JSON</button></div></div><ol class="log" id="log"><li class="empty">Press Play to follow a run.</li></ol><div class="inspect" id="inspect"></div></div></div></div></section>`;
  renderTry(p,trig);
  if(!ordered.length){ $("#wfTabs").innerHTML=""; $("#canvas").innerHTML=`<p class="note" style="padding:20px">Workflow data is not available on this copy of the site.</p>`; return; }
  $("#wfTabs").innerHTML=ordered.map((w,i)=>`<button class="tab" role="tab" type="button" data-i="${i}">${esc(w.name.split(" · ").slice(1).join(" · ")||w.name)}</button>`).join("");
  $("#wfTabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>draw(p,ordered[t.dataset.i]));
  draw(p,ordered[ordered.length>1&&/1 ·|Inbound/.test(ordered[0].name)?0:0]);
}
function renderTry(p,trig){
  const base=(DATA?.base||N8N_BASE).replace(/\/?$/,"/");
  const seen=new Set(); const cards=[];
  for(const t of trig){ const k=prettyType(t.t);
    if(t.t==="formTrigger"&&t.form){ const url=base+"form/"+t.form.path;
      cards.push(`<div class="panel tcard"><div class="kind"><i>FORM</i><div><b>${esc(t.form.title||t.n)}</b><div class="note">${esc(t.wf)}</div></div></div>${t.form.desc?`<p class="note">${esc(t.form.desc)}</p>`:""}<div class="fprev">${t.form.fields.slice(0,7).map(f=>`<label><span>${esc(f.l)}${f.req?' <span style="color:var(--bad)">*</span>':""}</span><span class="in">${f.ty==="dropdown"&&f.opts.length?esc(f.opts.slice(0,3).join(" · "))+(f.opts.length>3?" …":""):f.ty==="file"?"Upload "+esc(f.acc||"file"):f.ty==="checkbox"?"☐ "+esc(f.opts[0]||""):esc(f.ph||f.ty)}</span></label>`).join("")}</div><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open the live form ↗</a><p class="note">Opens on the OMNA n8n server. ngrok may show a one-time “Visit site” page first.</p></div>`); continue; }
    if(t.t==="webhook"&&t.hook){ if(seen.has("hook"+t.hook.path)) continue; seen.add("hook"+t.hook.path); const url=base+"webhook/"+t.hook.path;
      cards.push(`<div class="panel tcard"><div class="kind"><i>API</i><div><b>Webhook · ${esc(t.hook.method)}</b><div class="note">${esc(t.n)}</div></div></div><div class="copyrow"><code>${esc(url)}</code><button class="btn ghost sm" type="button" data-copy="${esc(url)}">Copy</button></div><p class="note">Used by Meta (Messenger and Instagram) to deliver messages to this project.</p></div>`); continue; }
    if(seen.has(t.t)) continue; seen.add(t.t);
    const txt={telegramTrigger:"Message the bot or tap its buttons in the team's Telegram group.",whatsAppTrigger:"Customers message the business WhatsApp number.",gmailTrigger:"Emails with attachments arriving in the finance inbox.",facebookLeadAdsTrigger:"New leads from a Facebook Lead Ads form.",scheduleTrigger:"Runs on its own: "+trig.filter(x=>x.t==="scheduleTrigger").map(x=>x.d).filter(Boolean).join(" · "),errorTrigger:"Fires when any workflow in the project fails, so errors are classified and reported.",executeWorkflowTrigger:"Called by the project's other workflows.",n8nTrigger:"Runs when the n8n server starts.",manualTrigger:"Run by hand from n8n, e.g. the test suite."}[t.t]||"";
    const tag={telegramTrigger:"TG",whatsAppTrigger:"WA",gmailTrigger:"@",facebookLeadAdsTrigger:"FB",scheduleTrigger:"⏱",errorTrigger:"!",executeWorkflowTrigger:"↳",n8nTrigger:"▶",manualTrigger:"▶"}[t.t]||"T";
    cards.push(`<div class="panel tcard"><div class="kind"><i>${tag}</i><div><b>${esc(k)}</b><div class="note">${esc(t.wf)}</div></div></div><p class="note">${esc(txt)}</p></div>`);
  }
  $("#try").innerHTML=cards.join("")||`<p class="note">No triggers found.</p>`;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast("Copied")}catch(e){toast("Select the address to copy it")}});
}
function wrap2(s,max=19){const w=s.split(" ");const L=[""];for(const x of w){if((L.at(-1)+" "+x).trim().length>max&&L.at(-1))L.push(x);else L[L.length-1]=(L.at(-1)+" "+x).trim()}if(L.length>2){L.length=2;L[1]=L[1].slice(0,max-1)+"…"}return L}
let cur=null, playing=false;
function draw(p,w){ cur=w; document.querySelectorAll("#wfTabs .tab").forEach(t=>t.setAttribute("aria-selected",t.textContent===(w.name.split(" · ").slice(1).join(" · ")||w.name)));
  const ns=w.nodes.filter(n=>n.t!=="stickyNote"); const W=152,H=56,SX=1.15,SY=1.15,PAD=50;
  const minX=Math.min(...ns.map(n=>n.x*SX)),minY=Math.min(...ns.map(n=>n.y*SY)); const pos={}; ns.forEach(n=>pos[n.n]={x:n.x*SX-minX+PAD,y:n.y*SY-minY+PAD});
  const wd=Math.max(...Object.values(pos).map(q=>q.x))+W+PAD, ht=Math.max(...Object.values(pos).map(q=>q.y))+H+PAD;
  let edges=""; w.edges.forEach(([s,t,ai],i)=>{const a=pos[s],b=pos[t];if(!a||!b)return;let d;
    if(ai){const x1=a.x+W/2,y1=a.y,x2=b.x+W/2,y2=b.y+H;d=`M${x1},${y1} C${x1},${y1-40} ${x2},${y2+40} ${x2},${y2}`}
    else{const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2; if(x2>x1+10){const c=Math.max(40,(x2-x1)/2);d=`M${x1},${y1} C${x1+c},${y1} ${x2-c},${y2} ${x2},${y2}`}else{const low=Math.max(a.y,b.y)+H+30;d=`M${x1},${y1} C${x1+50},${y1} ${x1+50},${low} ${x1},${low} L${x2},${low} C${x2-50},${low} ${x2-50},${y2} ${x2},${y2}`}}
    edges+=`<path class="edge${ai?" ai":""}" data-e="${i}" d="${d}"/>`});
  const nodes=ns.map(n=>{const q=pos[n.n];const [col,gl]=GLY[CAT(n.t)];const L=wrap2(n.n);return `<g class="node" tabindex="0" role="button" aria-label="${esc(n.n)}" data-n="${esc(n.n)}" transform="translate(${q.x},${q.y})"><rect class="box" width="${W}" height="${H}" rx="10"/><rect x="9" y="${H/2-11}" width="22" height="22" rx="6" fill="${col}" opacity=".16"/><text class="gl" x="20" y="${H/2+3}" text-anchor="middle" fill="${col}">${gl}</text>${L.map((l,i)=>`<text x="38" y="${(L.length===1?24:18)+i*13}">${esc(l)}</text>`).join("")}<text class="ty" x="38" y="${H-9}">${esc(prettyType(n.t)).slice(0,24)}</text></g>`}).join("");
  $("#canvas").innerHTML=`<svg width="${Math.round(wd*.78)}" height="${Math.round(ht*.78)}" viewBox="0 0 ${wd} ${ht}" role="img" aria-label="${esc(w.name)}">${edges}${nodes}</svg>`;
  $("#canvas").querySelectorAll(".node").forEach(el=>{const f=()=>inspect(w,el.dataset.n,el);el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  const starts=ns.filter(n=>CAT(n.t)==="trigger"&&n.t!=="respondToWebhook");
  $("#startSel").innerHTML=starts.map(n=>`<option>${esc(n.n)}</option>`).join("");
  $("#play").onclick=()=>play(w); $("#dl").onclick=()=>download(w);
  $("#log").innerHTML=`<li class="empty">Press Play to follow a run.</li>`;
  $("#inspect").innerHTML=`<b>${esc(w.name)}</b><span class="note">${ns.length} nodes · ${w.active?"active":"inactive"} in n8n. Click a node to read about it.</span>`;
}
function describe(n){ const bits=[]; const k=prettyType(n.t); if(n.d) bits.push(n.d.replace(/^=/,"").replace(/\{\{[^}]*\}\}/g,"…").slice(0,180)); if(n.form) bits.push("Form: "+(n.form.title||"")+" · "+n.form.fields.length+" fields"); if(n.hook) bits.push(n.hook.method+" /"+n.hook.path); return {k,txt:bits.join(" · ")} }
function inspect(w,name,el){ const n=w.nodes.find(x=>x.n===name); document.querySelectorAll(".node.sel").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); const {k,txt}=describe(n);
  const ins=w.edges.filter(e=>e[1]===name).map(e=>e[0]), outs=w.edges.filter(e=>e[0]===name).map(e=>e[1]);
  $("#inspect").innerHTML=`<span class="eyebrow">${esc(k)}</span><b>${esc(n.n)}</b>${txt?`<span class="note">${esc(txt)}</span>`:""}${ins.length?`<span class="note"><b>From:</b> ${ins.map(esc).join(", ")}</span>`:""}${outs.length?`<span class="note"><b>To:</b> ${outs.map(esc).join(", ")}</span>`:""}`; }
async function play(w){ if(playing) return; playing=true; $("#play").disabled=true;
  const start=$("#startSel").value; const svg=$("#canvas svg"); svg.querySelectorAll(".node").forEach(g=>g.classList.add("dim")); svg.querySelectorAll(".edge").forEach(e=>e.classList.remove("run"));
  $("#log").innerHTML=""; const seen=new Set([start]); let frontier=[start]; let stepN=0;
  while(frontier.length&&stepN<60){ const next=[];
    for(const name of frontier){ const g=svg.querySelector(`.node[data-n="${CSS.escape(name)}"]`); if(g){g.classList.remove("dim");g.classList.add("run");g.scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"})}
      const n=w.nodes.find(x=>x.n===name); const {k,txt}=describe(n); const li=document.createElement("li"); li.innerHTML=`<i></i><div><span class="k">${esc(name)}</span> <span class="v">· ${esc(txt||k)}</span></div>`; $("#log").appendChild(li); $("#log").scrollTop=1e6; stepN++;
      w.edges.forEach((e,i)=>{ if(e[0]===name&&!e[2]){ svg.querySelector(`.edge[data-e="${i}"]`)?.classList.add("run"); if(!seen.has(e[1])){seen.add(e[1]);next.push(e[1])} } });
      // AI sub-nodes attached to this node
      w.edges.forEach((e,i)=>{ if(e[1]===name&&e[2]){ svg.querySelector(`.edge[data-e="${i}"]`)?.classList.add("run"); const s=svg.querySelector(`.node[data-n="${CSS.escape(e[0])}"]`); s?.classList.remove("dim"); } });
      await sleep(260); }
    frontier=next; }
  const li=document.createElement("li"); li.innerHTML=`<i style="background:#3CC293"></i><div><span class="k">Done</span> <span class="v">· ${stepN} nodes on this path${frontier.length?" (stopped early)":""}</span></div>`; $("#log").appendChild(li);
  playing=false; $("#play").disabled=false; }
function download(w){ const f=DATA?.files?.[w.name]; if(!f){toast("Download is not available on this copy");return} const blob=new Blob([JSON.stringify(f,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=w.name.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+".json"; document.body.appendChild(a); a.click(); a.remove(); }

addEventListener("hashchange",route); route();
